name: p0-protected
on:
  pull_request:
    branches: [develop]
    paths: ['.github/workflows/p0-protected.yml', 'patches/**', 'tools/**', 'tests/**', 'agentguard/**', 'deploy/compose/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p0-protected-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build-and-accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: agentguard-protected-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact event commit without persistent credentials
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH" \
          GIT_TERMINAL_PROMPT=0 git fetch --depth=1 origin "$COMMIT"
          unset AUTH GH_TOKEN
          git checkout --detach FETCH_HEAD
      - name: Unit and regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Preserve exact build inputs (not a security PASS)
        run: |
          mkdir -p "$RUNNER_TEMP/inputs"
          git archive --format=tar HEAD > "$RUNNER_TEMP/inputs/agentguard.tar"
          git init "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" fetch --depth=1 https://github.com/agentgateway/agentgateway.git fe6732474a96a0363dfb9822859af4e9bab360fa
          git -C "$RUNNER_TEMP/upstream" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/upstream" rev-parse HEAD)" = fe6732474a96a0363dfb9822859af4e9bab360fa
          git -C "$RUNNER_TEMP/upstream" archive --format=tar HEAD > "$RUNNER_TEMP/inputs/upstream.tar"
          python3 -m tools.fetch_gateway --output "$RUNNER_TEMP/inputs/agentgateway-stock"
          (cd "$RUNNER_TEMP/inputs" && sha256sum agentguard.tar upstream.tar agentgateway-stock > SHA256SUMS)
      - name: Upload reproducible inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-build-inputs
          path: ${{ runner.temp }}/inputs/
          if-no-files-found: error
          retention-days: 7
      - name: Apply strict parser to audited upstream
        run: |
          mkdir -p reports
          python3 -m tools.patch_gateway --upstream "$RUNNER_TEMP/upstream" --report reports/gateway-patch.json
      - name: Install pinned upstream Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Compile and test actual upstream parser
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
          CARGO_BUILD_JOBS: '2'
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/upstream"
          cargo test --locked -p agentgateway --no-default-features --features crypto-aws-lc --lib agentguard_strict -- --nocapture 2>&1 | tee "$GITHUB_WORKSPACE/reports/rust-tests.log"
          cargo build --locked -p agentgateway-app --no-default-features --features crypto-aws-lc --bin agentgateway 2>&1 | tee "$GITHUB_WORKSPACE/reports/gateway-build.log"
      - name: Record build manifest and preserve runnable binary
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          mkdir -p build
          cp "$RUNNER_TEMP/upstream/target/debug/agentgateway" build/agentgateway
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          manifest = json.loads(Path('reports/gateway-patch.json').read_text())
          manifest.update(kind='agentguard-gateway-build/v1',
              binary_sha256=hashlib.sha256(Path('build/agentgateway').read_bytes()).hexdigest(),
              agentguard_commit=os.environ['BUILD_SHA'],
              rust_toolchain='1.98.0', build_profile='dev',
              target='x86_64-unknown-linux-gnu', features=['crypto-aws-lc'], default_features=False)
          Path('build/manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PY
          sha256sum build/manifest.json > build/manifest.sha256
          echo "TRUSTED_BUILD_MANIFEST_SHA256=$(sha256sum build/manifest.json | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Native protected wire acceptance
        run: |
          python3 -m tools.protected_gateway_probe --gateway-bin build/agentgateway --build-manifest build/manifest.json --trusted-manifest-sha256 "$TRUSTED_BUILD_MANIFEST_SHA256" --report reports/gateway-protected.json
      - name: Isolated Compose protected acceptance
        run: |
          docker compose -f deploy/compose/compose.protected.yaml config --quiet
          docker compose -f deploy/compose/compose.protected.yaml run --build --rm protected
      - name: Verify persisted protected evidence after container removal
        run: |
          docker compose -f deploy/compose/compose.protected.yaml run --rm --entrypoint python protected -c '
          import json
          from pathlib import Path
          r = json.loads(Path("/evidence/gateway-protected.json").read_text())
          assert r["wire_acceptance"] == "PASS"
          assert len(r["controls"]) == 6 and len(r["negative_cases"]) == 72 and len(r["fault_cases"]) == 6
          assert r["p0_release_gate"] == "NOT_EVALUATED"
          assert Path("/evidence/gateway-protected.gateway.log").stat().st_size > 0
          assert len(Path("/evidence/gateway-protected.observations.jsonl").read_text().splitlines()) == 84
          print("PERSISTED_PROTECTED_WIRE_EVIDENCE_VERIFIED; full P0 NOT_EVALUATED")
          '
      - name: Export Compose evidence, including failure observations
        if: always() && env.TRUSTED_BUILD_MANIFEST_SHA256 != ''
        run: |
          docker compose -f deploy/compose/compose.protected.yaml run --rm --entrypoint python protected -c '
          import sys, tarfile
          with tarfile.open(fileobj=sys.stdout.buffer, mode="w|") as t:
              t.add("/evidence", arcname="compose")
          ' > reports/compose-evidence.tar
      - name: Preserve build outputs and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-gateway-build
          path: |
            build/
            reports/
          if-no-files-found: error
          retention-days: 7
