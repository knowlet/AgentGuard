name: contract-tests
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact event commit (no third-party action)
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "$COMMIT"
          git checkout --detach FETCH_HEAD
      - name: Python contract and review regressions
        run: python3 -m unittest discover -s tests -v
