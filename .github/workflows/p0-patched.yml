name: p0-patched-wire
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build-and-accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      COMPOSE_PROJECT_NAME: agentguard-patched-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact event commit with ephemeral credentials
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH" \
          GIT_TERMINAL_PROMPT=0 git fetch --depth=1 origin "$COMMIT"
          unset AUTH GH_TOKEN
          git checkout --detach FETCH_HEAD
      - name: Python contract tests
        run: |
          mkdir -p reports
          python3 -m unittest discover -s tests -v 2>&1 | tee reports/python-tests.log
          git rev-parse HEAD > reports/tested-commit.txt
          git archive --format=zip HEAD -o reports/source.zip
      - name: Preserve exact source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-snapshot-${{ github.run_id }}
          path: reports/source.zip
          if-no-files-found: error
      - name: Fetch pinned upstream and apply exact-source patch
        run: |
          git init "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" remote add origin https://github.com/agentgateway/agentgateway.git
          git -C "$RUNNER_TEMP/upstream" fetch --depth=1 origin fe6732474a96a0363dfb9822859af4e9bab360fa
          git -C "$RUNNER_TEMP/upstream" checkout --detach FETCH_HEAD
          python3 -m tools.apply_gateway_patch --source "$RUNNER_TEMP/upstream" --manifest reports/patch-manifest.json
          git -C "$RUNNER_TEMP/upstream" diff > reports/agentgateway.patch
          cp "$RUNNER_TEMP/upstream/Cargo.lock" reports/upstream-Cargo.lock
          rustup toolchain install 1.98 --profile minimal
      - name: Native Serde regression tests (not Gateway E2E)
        run: |
          python3 -m tools.prepare_wire_harness --source "$RUNNER_TEMP/upstream" --output "$RUNNER_TEMP/wire-harness"
          RUSTUP_TOOLCHAIN=1.98 cargo test --manifest-path "$RUNNER_TEMP/wire-harness/Cargo.toml" 2>&1 | tee reports/serde-tests.log
          cp "$RUNNER_TEMP/wire-harness/Cargo.lock" reports/serde-Cargo.lock
      - name: Compile patched Gateway with upstream locked dependencies
        working-directory: ${{ runner.temp }}/upstream
        run: |
          cargo build --locked -p agentgateway-app --bin agentgateway --no-default-features --features crypto-aws-lc 2>&1 | tee "$GITHUB_WORKSPACE/reports/build.log"
          mkdir -p "$GITHUB_WORKSPACE/reports/patched-bin"
          cp target/debug/agentgateway "$GITHUB_WORKSPACE/reports/patched-bin/agentgateway"
          rustc --version > "$GITHUB_WORKSPACE/reports/rustc.txt"
      - name: Bind manifest to the actual built bytes
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('reports/patch-manifest.json')
          m = json.loads(p.read_text())
          m['binary_sha256'] = hashlib.sha256(Path('reports/patched-bin/agentgateway').read_bytes()).hexdigest()
          m['cargo_lock_sha256'] = hashlib.sha256(Path('reports/upstream-Cargo.lock').read_bytes()).hexdigest()
          m['rustc'] = Path('reports/rustc.txt').read_text().strip()
          p.write_text(json.dumps(m, indent=2) + '\n')
          PY
      - name: Real patched Gateway protected-wire acceptance
        run: python3 -m tools.gateway_acceptance --gateway-bin reports/patched-bin/agentgateway --build-manifest reports/patch-manifest.json --report reports/gateway-patched.json
      - name: Real patched Gateway in isolated Compose
        run: |
          docker compose -f deploy/compose/compose.patched.yaml config --quiet
          docker compose -f deploy/compose/compose.patched.yaml run --build --rm patched-wire
          docker compose -f deploy/compose/compose.patched.yaml run --rm --entrypoint python patched-wire -c 'import json; from pathlib import Path; r=json.loads(Path("/evidence/gateway-patched.json").read_text()); assert r["protected_wire_gate"]=="PASS"; assert Path("/evidence/gateway-patched.gateway.log").stat().st_size>0; print("persisted patched evidence verified")'
      - name: Summarize and collect Compose evidence
        if: always()
        run: |
          if [ -f reports/gateway-patched.json ]; then cat reports/gateway-patched.json; fi
          if docker volume inspect "${COMPOSE_PROJECT_NAME}_patched-evidence" >/dev/null 2>&1; then
            docker compose -f deploy/compose/compose.patched.yaml run --rm --entrypoint python patched-wire -c 'from pathlib import Path; print(Path("/evidence/gateway-patched.json").read_text())' > reports/compose-patched.json || true
          fi
      - name: Upload raw evidence (not a signed deployment attestation)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: patched-wire-evidence-${{ github.run_id }}
          path: |
            reports/*.json
            reports/*.log
            reports/*.txt
            reports/*.lock
            reports/*.patch
          if-no-files-found: error
          retention-days: 30
